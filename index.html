<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <title>Odin Project - Rock Paper Scissors</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <!-- Roboto-monospace font from Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="buttons-container">
    <div class="rps-buttons">
      <button class="rock">Rock</button>
      <button class="paper">Paper</button>
      <button class="scissor">Scissor</button>
    </div>
    <button class="reset" disabled>Restart</button>
  </div>

  <div class="result-board-container">
    <div class="result-board-title">Result Board</div>
    <div class="score-board">0 : 0</div>
    <ul class="result-board">

    </ul>
  </div>

</body>
</html>
